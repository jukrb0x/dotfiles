#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio = [1, 3, 4]
sort_by = "natural"

[preview]
wrap = "yes"
tab_size = 4
max_width = 1200
max_height = 1600

[opener]
# Yazi escapes each path in %s; quoting it again breaks spaces/multi-selection.
edit = [
    { run = 'if command -v lvim >/dev/null 2>&1; then lvim %s; else nvim %s; fi', block = true, desc = "Edit in LunarVim / Neovim", for = "unix" },
    { run = 'pwsh -NoLogo -NoProfile -File "%USERPROFILE%\.local\bin\lvim.ps1" %s', block = true, desc = "Edit in LunarVim / Neovim", for = "windows" },
]

[open]
# Inherit upstream MIME rules for text, code, media and archives. Unknown types
# still open in their system app, with Edit available in the O menu.
append_rules = [
    { url = "*", use = ["open", "edit", "reveal"] },
]

# Inherit native previewers/preloaders; their tools are in required manifests.
